name: build

on:
  push:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  # The units are measured on a PC as well as built for the instrument: a change
  # in the sound is a failure even when the compiler is happy.
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Measure the units against the goldens
        run: ./tests/run.sh

  units:
    runs-on: ubuntu-22.04
    # Only the release step needs this, and only for tags; the build itself reads
    # the checkout.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # The gcc 5.4 toolchain Korg recommends for the NTS-1 is 32 bit only.
      - name: Enable 32-bit toolchain support
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libc6:i386 zip

      - name: Build units
        run: ./scripts/build.sh

      - name: Show what was built
        run: ls -l dist

      # The ELFs come along so the cycle counts in the README can be taken from
      # the build the instrument actually gets, not from whatever gcc a sandbox
      # happens to have.
      - uses: actions/upload-artifact@v4
        with:
          name: nts1-units
          path: |
            dist/*.ntkdigunit
            units/*/build/*.elf
          if-no-files-found: error

      # Cutting a beta is pushing a tag: this is the build the instrument gets,
      # and these are its files. A release published by hand takes the same path
      # as an existing release, so both ways end with the eight packages on it.
      # Deleting a tag fires a push event too, hence the deleted check.
      - name: Attach units to the release
        if: github.event_name == 'release' || (startsWith(github.ref, 'refs/tags/v') && !github.event.deleted)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tag="${{ github.event.release.tag_name || github.ref_name }}"

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag exists, replacing its packages"
            gh release upload "$tag" dist/*.ntkdigunit --clobber
            exit 0
          fi

          # A tag with a suffix in it is a test of the thing, not a finished
          # release: v0.2.0-beta, v1.0.0-rc1. The notes are the commit list, to
          # be edited afterwards.
          flags=""
          case "$tag" in
            *-*) flags="--prerelease" ;;
          esac
          echo "creating $tag ${flags:+(prerelease)}"
          gh release create "$tag" dist/*.ntkdigunit --title "$tag" --generate-notes $flags
